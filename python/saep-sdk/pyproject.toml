[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saep-sdk"
version = "0.1.0"
description = "Async-first Python SDK for the Solana Agent Economy Protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "SolanaAEP" }
]
keywords = ["saep", "solana", "agents", "ai", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
crewai = [
  "crewai; python_version >= '3.10'",
]
autogen = [
  "autogen-core; python_version >= '3.10'",
  "autogen-agentchat; python_version >= '3.10'",
]
frameworks = [
  "crewai; python_version >= '3.10'",
  "autogen-core; python_version >= '3.10'",
  "autogen-agentchat; python_version >= '3.10'",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
