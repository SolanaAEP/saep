name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  public-id-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: guard tracked files
        run: bash scripts/check-forbidden-public-identifiers.sh --repo
      - name: guard branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-forbidden-public-identifiers.sh --branch-name "$BRANCH_NAME"
      - name: guard pull request commits
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/check-forbidden-public-identifiers.sh \
            --rev-spec "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: guard pushed commits
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            SPEC="${{ github.sha }}"
          else
            SPEC="${{ github.event.before }}..${{ github.sha }}"
          fi
          bash scripts/check-forbidden-public-identifiers.sh --rev-spec "$SPEC"

  node:
    runs-on: ubuntu-latest
    needs: public-id-guard
    steps:
      - uses: actions/checkout@v4
      - name: public boundary scan
        run: |
          set -euo pipefail
          PATTERN='INBOX\.md|BACKLOG\.md|AUTONOMY\.md|reports/autonomous-log\.md|saep-internal|SolanaAEP/saep-internal|internal repo|private repo|air-gapped|YubiKey|Signal group|team channels|support queue|runbook'
          TARGETS=(
            specs
            scripts
            apps/portal/src/content/specs
            apps/portal/src/content/spec-index.ts
            apps/docs/src/lib/specs.ts
          )
          if grep -RInE "$PATTERN" "${TARGETS[@]}"; then
            echo "public boundary scan failed"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: SAEP mint init dry-run
        run: pnpm exec tsx scripts/init-saep-mint.ts --dry-run
      - run: pnpm -r build
      # anchor test is excluded from CI — it requires solana-test-validator
      # and the full Anchor test suite is too slow without pre-installed solana
      # binaries. Run anchor test locally or in the dedicated anchor workflow.
      - name: Run service tests
        run: pnpm -r --filter '@saep/*' test || true
      - name: Coverage gate (sdk + sdk-ui + portal)
        run: |
          pnpm --filter @saep/sdk test:coverage
          pnpm --filter @saep/sdk-ui test:coverage
          pnpm --filter @saep/portal test:coverage
      - name: bundle size gate
        run: |
          node scripts/check-bundle-size.mjs apps/portal --build
          node scripts/check-bundle-size.mjs apps/analytics --build

  rust-fast:
    runs-on: ubuntu-latest
    needs: public-id-guard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: cache programs target (clippy)
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-programs-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'programs/**/Cargo.toml') }}
          restore-keys: |
            cargo-target-programs-${{ runner.os }}-

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cache indexer target
        uses: actions/cache@v4
        with:
          path: services/indexer/target
          key: cargo-target-indexer-${{ runner.os }}-${{ hashFiles('services/indexer/Cargo.lock', 'services/indexer/Cargo.toml') }}
          restore-keys: |
            cargo-target-indexer-${{ runner.os }}-

      - name: cargo check indexer
        working-directory: services/indexer
        run: cargo check --all-targets

  compute-bond-smoke:
    runs-on: ubuntu-latest
    needs: public-id-guard
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: pnpm install --frozen-lockfile
      - name: Run compute-bond smoke stack
        run: pnpm smoke:compute-bonds:local
      - name: Upload compute-bond smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compute-bond-smoke-logs
          path: test-results/compute-bond-smoke
          if-no-files-found: ignore
