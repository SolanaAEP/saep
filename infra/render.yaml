        value: 24
      - key: BUYBACK_MODE
        value: active
      - key: SOLANA_RPC_URL
        sync: false
      - key: SAEP_CLUSTER
        value: mainnet-beta
      - key: JUPITER_API_URL
        value: "https://quote-api.jup.ag/v6"
      - key: FEE_COLLECTOR_PROGRAM_ID
        value: 4xLpFgjpZwJbf61UyvyMhmEBmeJzPaCyKvZeYuK2YFFu
