      - key: OPERATOR_KEYPAIR_PATH
        sync: false
      - key: BUYBACK_SWAP_THRESHOLD_USDC_BASE
        value: "10000000"
      - key: BUYBACK_SLIPPAGE_BPS
        value: "200"

  - type: web
    name: saep-portal
    env: node
    plan: starter
    healthCheckPath: /
    buildCommand: pnpm install --frozen-lockfile && pnpm exec turbo run build --filter=@saep/portal...
