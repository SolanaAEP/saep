databases:
  - name: saep-postgres
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: saep-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: saep-iacp
    env: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @saep/iacp build
    startCommand: pnpm --filter @saep/iacp start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: saep-redis
          property: connectionString

  - type: worker
    name: saep-proof-gen
    env: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @saep/proof-gen build
    startCommand: pnpm --filter @saep/proof-gen start:worker
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: saep-redis
          property: connectionString

  - type: web
    name: saep-x402-gateway
    env: node
    plan: starter
    healthCheckPath: /healthz
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @saep/x402-gateway build
    startCommand: pnpm --filter @saep/x402-gateway start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: saep-redis
          property: connectionString
      - key: SOLANA_RPC_URL
        sync: false
      - key: SAEP_OPERATOR_KEYPAIR
        sync: false
      - key: SAEP_TASK_MARKET_PROGRAM_ID
        sync: false
      - key: SAEP_AGENT_REGISTRY_PROGRAM_ID
        sync: false
      - key: CORS_ORIGINS
        value: "https://app.buildonsaep.com,https://saep-app.onrender.com"

  - type: worker
    name: saep-indexer
    env: docker
    plan: starter
    dockerfilePath: services/indexer/Dockerfile
    envVars:
      - key: INDEXER_ROLE
        value: poller
      - key: DATABASE_URL
        fromDatabase:
          name: saep-postgres
          property: connectionString
      - key: SOLANA_CLUSTER
        value: mainnet
      - key: HELIUS_API_KEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: YELLOWSTONE_ENDPOINT
        sync: false
      - key: YELLOWSTONE_TOKEN
        sync: false

  - type: web
    name: saep-indexer-api
    env: docker
    plan: starter
    dockerfilePath: services/indexer/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: INDEXER_ROLE
        value: api
      - key: DATABASE_URL
        fromDatabase:
          name: saep-postgres
          property: connectionString
      - key: HEALTHCHECK_PORT
        value: "10001"
      - key: API_PORT
        value: "10000"
      - key: CORS_ORIGINS
        value: "https://app.buildonsaep.com,https://saep-app.onrender.com"

  - type: web
    name: saep-discovery
    env: node
    plan: starter
    healthCheckPath: /healthz
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @saep/discovery build
    startCommand: pnpm --filter @saep/discovery start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DISCOVERY_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: saep-postgres
          property: connectionString
      - key: SAEP_CLUSTER
        value: mainnet-beta
      - key: DISCOVERY_WEBHOOK_PRODUCER_ENABLED
        value: "true"
      - key: DISCOVERY_WEBHOOK_PRODUCER_INTERVAL_MS
        value: "5000"
      - key: DISCOVERY_WEBHOOK_PRODUCER_BATCH_SIZE
        value: "100"
      - key: WEBHOOK_RETRY_BASE_MS
        value: "1000"
      - key: WEBHOOK_MAX_ATTEMPTS
        value: "4"
      - key: WEBHOOK_SIGNATURE_WINDOW_SECONDS
        value: "300"
      - key: WEBHOOK_ADMIN_TOKEN
        sync: false
      - key: WEBHOOK_SERVICE_TOKEN
        sync: false
      - key: WEBHOOK_STORE_PATH
        sync: false
      - key: CORS_ORIGINS
        value: "https://app.buildonsaep.com,https://saep-app.onrender.com"

  - type: web
    name: saep-fee-crank
    env: node
    plan: starter
    healthCheckPath: /healthz
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @saep/fee-crank build
    startCommand: pnpm --filter @saep/fee-crank start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: SOLANA_RPC_URL
        sync: false
      - key: SAEP_CLUSTER
        value: mainnet-beta
      - key: OPERATOR_KEYPAIR_PATH
        sync: false
      - key: FEE_COLLECTOR_PROGRAM_ID
        value: 4xLpFgjpZwJbf61UyvyMhmEBmeJzPaCyKvZeYuK2YFFu
      - key: NXS_STAKING_PROGRAM_ID
        value: GjXfJ6MHb6SJ4XBK3qcpGw4n256qYPrDcXrNj6kf2i2Z
      - key: FEE_CRANK_POLL_INTERVAL_MS
        value: "600000"
      - key: FEE_CRANK_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: saep-postgres
          property: connectionString

  - type: worker
    name: saep-buyback-bot
    env: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @saep/buyback-bot build
    startCommand: pnpm --filter @saep/buyback-bot start
    envVars:
