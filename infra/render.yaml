databases:
  - name: saep-postgres
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: saep-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: saep-iacp
    env: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @saep/sdk build && pnpm --filter @saep/iacp build
    startCommand: pnpm --filter @saep/iacp start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: saep-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://buildonsaep.com,https://app.buildonsaep.com,https://saep-app.onrender.com"

  - type: worker
    name: saep-proof-gen
    env: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @saep/proof-gen build
    startCommand: pnpm --filter @saep/proof-gen start:worker
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: saep-redis
          property: connectionString

  - type: web
    name: saep-x402-gateway
    env: node
    plan: starter
    healthCheckPath: /healthz
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @saep/sdk build && pnpm --filter @saep/x402-gateway build
    startCommand: pnpm --filter @saep/x402-gateway start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: saep-redis
          property: connectionString
      - key: SOLANA_RPC_URL
        sync: false
      - key: SAEP_OPERATOR_KEYPAIR
        sync: false
      - key: SAEP_TASK_MARKET_PROGRAM_ID
        sync: false
      - key: SAEP_AGENT_REGISTRY_PROGRAM_ID
        sync: false
      - key: CORS_ORIGINS
        value: "https://buildonsaep.com,https://app.buildonsaep.com,https://saep-app.onrender.com"

  - type: worker
    name: saep-indexer
    env: docker
    plan: starter
    dockerfilePath: services/indexer/Dockerfile
    envVars:
      - key: INDEXER_ROLE
        value: poller
      - key: DATABASE_URL
        fromDatabase:
          name: saep-postgres
          property: connectionString
      - key: HELIUS_API_KEY
        sync: false
      - key: HELIUS_YELLOWSTONE_ENDPOINT
        sync: false

  - type: web
    name: saep-indexer-api
    env: docker
    plan: starter
    dockerfilePath: services/indexer/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: INDEXER_ROLE
        value: api
      - key: DATABASE_URL
        fromDatabase:
          name: saep-postgres
          property: connectionString
      - key: HEALTHCHECK_PORT
        value: "10001"
      - key: API_PORT
        value: "10000"
      - key: CORS_ORIGINS
        value: "https://buildonsaep.com,https://app.buildonsaep.com,https://saep-app.onrender.com"

  - type: web
    name: saep-portal
    env: node
    plan: starter
    healthCheckPath: /
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @saep/sdk build && pnpm --filter @saep/ui build && pnpm --filter @saep/sdk-ui build && pnpm --filter @saep/portal build
    startCommand: pnpm --filter @saep/portal start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NEXT_PUBLIC_SOLANA_CLUSTER
        value: devnet
      - key: NEXT_PUBLIC_RPC_URL
        sync: false
      - key: NEXT_PUBLIC_INDEXER_URL
        value: "https://buildonsaep.com/api/discovery"
      - key: NEXT_PUBLIC_DEFAULT_PAYMENT_MINT
        sync: false
      - key: DISCOVERY_API_URL
        value: "https://saep-indexer-api.onrender.com"
      - key: X402_GATEWAY_URL
        value: "https://saep-x402-gateway.onrender.com"
      - key: IACP_API_URL
        value: "https://saep-iacp.onrender.com"
      - key: NEXT_PUBLIC_IACP_WS_URL
        value: "wss://saep-iacp.onrender.com/ws"
      - key: SESSION_SECRET
        generateValue: true
